<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="accessBeltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
  </defs>
  <!-- Main Circle Background -->
  <rect width="100" height="100" rx="28" fill="url(#accessBeltGrad)" />
  
  <!-- Outer Belt Arc -->
  <path d="M 22 50 C 22 28, 78 28, 78 50 C 78 72, 22 72, 22 50" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Inner Belt Pulse Loop -->
  <path d="M 28 50 C 28 34, 72 34, 72 50 C 72 66, 28 66, 28 50 Z" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Location Pin / Food Apple Node -->
  <circle cx="50" cy="50" r="9" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3" />
</svg>
